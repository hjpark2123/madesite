<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원고 진행 상황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 장짜리 작업대 — 위에 제목과 탭, 아래에 줄 단위로 바로 고치는 표 / 같은 데이터를 날짜에 꽂은 달력 */
:root{
  --ground:#F4F3F7; --surface:#FFFFFF; --surface-2:#FAF9FC; --line:#E2E0EA; --line-strong:#CBC8D6;
  --ink:#211F2B; --muted:#6C6878; --faint:#9A96A6; --btn:#2A2740; --btn-ink:#FFFFFF;
  --focus:#7B5CD6; --danger:#C0392B; --danger-bg:#FDF0EE; --danger-line:#F1C4BD;
  --warn-bg:#FFF4EC; --warn-line:#F4CFB4; --warn-ink:#A1460E;
  --today:#7B5CD6; --sun:#C0392B; --sat:#3A63B8;
  --pc-ink:#1F5FD1; --pc-bg:#EEF4FF; --pc-line:#C9DAFB; --star:#12C94E;
  --hj-bg:#FEF7FA; --hj-line:#F5D6E3; --hj-ink:#B02C63; --hj-solid:#F07AAB;
  --dd-bg:#FFFCEC; --dd-line:#F1E3A6; --dd-ink:#7E6100; --dd-solid:#F5CF2E;
  --bj-bg:#F9F6FE; --bj-line:#DFD3F4; --bj-ink:#5F3AAE; --bj-solid:#9A74E0;
  --none-bg:#F1F0F4; --none-line:#D4D1DD; --none-ink:#5E5A6B; --none-solid:#BDB9C8;
  --shadow:0 1px 2px rgba(33,31,43,.06),0 4px 14px rgba(33,31,43,.05);
  --font-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Gowun Batang","Apple SD Gothic Neo","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16151C; --surface:#201F28; --surface-2:#1B1A22; --line:#33313F; --line-strong:#4A4759;
    --ink:#EEEDF3; --muted:#A7A3B5; --faint:#7A7689; --btn:#E9E6F5; --btn-ink:#1B1A22;
    --focus:#A98BF0; --danger:#F07A6A; --danger-bg:#2E1F1F; --danger-line:#5A3330;
    --warn-bg:#2B2119; --warn-line:#5A3F2A; --warn-ink:#F5B183;
    --today:#A98BF0; --sun:#F07A6A; --sat:#8EA9EA; --pc-ink:#8FB4FF; --pc-bg:#1C2436; --pc-line:#34466B; --star:#3DEB78;
    --hj-bg:#282026; --hj-line:#4E3643; --hj-ink:#F6A8C8; --hj-solid:#E0679A;
    --dd-bg:#27251D; --dd-line:#4C4630; --dd-ink:#F3D768; --dd-solid:#D6B226;
    --bj-bg:#24212E; --bj-line:#443B5C; --bj-ink:#C8B2F5; --bj-solid:#8E6AD8;
    --none-bg:#26252E; --none-line:#44414F; --none-ink:#B9B5C6; --none-solid:#6A6679;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#16151C; --surface:#201F28; --surface-2:#1B1A22; --line:#33313F; --line-strong:#4A4759;
  --ink:#EEEDF3; --muted:#A7A3B5; --faint:#7A7689; --btn:#E9E6F5; --btn-ink:#1B1A22;
  --focus:#A98BF0; --danger:#F07A6A; --danger-bg:#2E1F1F; --danger-line:#5A3330;
  --warn-bg:#2B2119; --warn-line:#5A3F2A; --warn-ink:#F5B183;
  --today:#A98BF0; --sun:#F07A6A; --sat:#8EA9EA; --pc-ink:#8FB4FF; --pc-bg:#1C2436; --pc-line:#34466B; --star:#3DEB78;
  --hj-bg:#282026; --hj-line:#4E3643; --hj-ink:#F6A8C8; --hj-solid:#E0679A;
  --dd-bg:#27251D; --dd-line:#4C4630; --dd-ink:#F3D768; --dd-solid:#D6B226;
  --bj-bg:#24212E; --bj-line:#443B5C; --bj-ink:#C8B2F5; --bj-solid:#8E6AD8;
  --none-bg:#26252E; --none-line:#44414F; --none-ink:#B9B5C6; --none-solid:#6A6679;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding-block:18px 80px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (max-width:560px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live[data-s="live"] i{background:#2EAD5B}
.live[data-s="off"] i{background:var(--danger)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.9}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}

/* tabs + toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tab{border:0;background:transparent;border-radius:7px;padding:6px 16px;font-weight:600;color:var(--muted);min-height:34px}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;min-height:38px;width:200px;max-width:100%}
.sel{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:32px;color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--ink)}
.sortbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.sortbar .k{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:2px}
.sortbar .chip{padding:4px 11px}
.fst{position:relative}
.fst-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.fst-btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.fst-btn .cv{font-size:10px;color:var(--muted)}
.fst-pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:220px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px}
.fst-pop label{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.fst-pop label:hover{background:var(--surface-2)}
.fst-pop input{width:17px;height:17px;margin:0;accent-color:var(--ink);flex:none}
.fst-pop .n{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.fst-pop .ft{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);margin-top:4px;padding:6px 2px 0}
.fst-pop .ft button{border:0;background:none;font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.fst-pop .ft button:hover{background:var(--surface-2)}
@media (max-width:560px){.fst-pop{position:fixed;left:16px;right:16px;top:auto;bottom:16px;min-width:0}}

/* table */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto}
.grid{min-width:1250px}
.row{display:grid;grid-template-columns:92px minmax(170px,1.3fr) minmax(76px,.55fr) 108px 88px 118px 190px minmax(190px,1.6fr) minmax(140px,1fr) 76px;border-bottom:1px solid var(--line);align-items:stretch}
.row:last-child{border-bottom:0}
.head{background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.head>div{padding:10px 10px}
.hs{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:3px;letter-spacing:inherit}
.hs:hover{color:var(--ink)}
.hs.on{color:var(--ink)}
.hs .ar{font-size:10px}
@media (min-width:761px){
  body.tbl{height:100dvh;overflow:hidden}
  body.tbl .wrap{height:100dvh;display:flex;flex-direction:column;padding-block:18px 10px}
  body.tbl #view-table{flex:1;min-height:0;display:flex;flex-direction:column}
  body.tbl .sheet{flex:1;min-height:0;overflow:auto}
  .row.head{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--line)}
}
.head .h-caution{color:var(--warn-ink)}
.cell{padding:6px 6px;min-width:0;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.cell:last-child{border-right:0}
.lbl{display:none}
.f{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 7px;line-height:1.5;resize:none;min-width:0}
.f:hover{background:var(--surface-2)}
.f:focus{background:var(--surface);border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.f::placeholder{color:var(--faint)}
.f:not(:focus)::placeholder{color:transparent}
textarea.f{field-sizing:content;min-height:34px;overflow:hidden}
.f.title{font-weight:600}
.f.date{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.f.date.bad{border-color:var(--danger);background:var(--danger-bg)}
.dmeta{font-size:11.5px;color:var(--muted);padding:0 8px;font-variant-numeric:tabular-nums;min-height:17px}
.dmeta .dd{color:var(--focus);font-weight:600}
.dmeta.err{color:var(--danger)}
.dmeta.linked{color:var(--pc-ink)}
.f.date.linked{color:var(--pc-ink);font-weight:700}
.tline{display:flex;align-items:center;gap:0}
.star{border:0;background:none;font-size:17px;line-height:1;padding:4px 2px 4px 4px;color:var(--line-strong);border-radius:5px;flex:none}
.star:hover{color:var(--faint)}
.star[aria-pressed="true"]{color:var(--star)}
.ssel{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 4px;font-size:13px;cursor:pointer;color:var(--ink)}
.ssel:hover{background:var(--surface-2)}
.ssel:focus{border-color:var(--focus);outline:none}
.ssel.pc{color:var(--pc-ink);font-weight:700}
.ssel.blank:not(:focus){color:transparent}
.ssel option{color:var(--ink);background:var(--surface)}
.serf{display:flex;gap:4px;align-items:center}
.serf .f{border-color:var(--line)}
.serf .f:focus{border-color:var(--focus)}
.serf .sno{width:46px;flex:none;text-align:right}
.serf .gw{font-size:13px;color:var(--ink);flex:none;padding-right:2px}
.del{white-space:nowrap}
.f.caution.has{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.f.caution.has:focus{border-color:var(--focus)}
.pcbadge{align-self:flex-start;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--pc-line);background:var(--pc-bg);color:var(--pc-ink);font-size:12px;font-weight:700;border-radius:5px;padding:1px 4px 1px 7px;margin:2px 6px 0;line-height:1.5}
.pcbadge .x{font-weight:400;opacity:.55;padding:0 2px}
.pcbadge:hover .x{opacity:1}
.bsel{appearance:none;-webkit-appearance:none;border:1px solid var(--none-line);background:var(--none-bg);color:var(--none-ink);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:600;width:100%;min-height:30px;cursor:pointer;text-align:center;text-align-last:center}
.row[data-brand="hj"] .bsel{background:var(--hj-bg);border-color:var(--hj-line);color:var(--hj-ink)}
.row[data-brand="dd"] .bsel{background:var(--dd-bg);border-color:var(--dd-line);color:var(--dd-ink)}
.row[data-brand="bj"] .bsel{background:var(--bj-bg);border-color:var(--bj-line);color:var(--bj-ink)}
.row[data-brand="none"] .bsel{background:transparent;border-color:transparent;color:transparent}
.row[data-brand="none"] .bsel:hover{border-color:var(--line-strong)}
.row[data-brand="none"] .bsel:focus{border-color:var(--focus);color:var(--muted)}
.bsel option{color:var(--ink);background:var(--surface)}
.del{border:1px solid var(--danger-line);background:var(--danger-bg);color:var(--danger);border-radius:7px;font-size:13px;font-weight:600;padding:5px 8px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;gap:4px;width:100%}
.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.del svg{width:14px;height:14px;flex:none}
.c-del{justify-content:flex-start;padding-top:8px}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--focus) 14%,transparent)}100%{background:transparent}}
.addrow{display:flex;justify-content:flex-start;padding:10px 12px;border-top:1px solid var(--line)}
.addrow button{border:0;background:transparent;color:var(--muted);font-weight:500;padding:6px 8px;border-radius:6px}
.addrow button:hover{background:var(--surface-2);color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.count{color:var(--muted);font-size:13px;margin:10px 2px 0}

/* phone: rows become cards */
@media (max-width:760px){
  .sheet{background:transparent;border:0;box-shadow:none;overflow:visible}
  .grid{min-width:0;display:flex;flex-direction:column;gap:10px}
  .row.head{display:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
  .row:last-child{border-bottom:1px solid var(--line)}
  .cell{border-right:0;padding:2px 0}
  .lbl{display:block;font-size:11.5px;font-weight:600;color:var(--muted);padding:0 7px}
  .c-brand{grid-column:1;grid-row:1}
  .c-brand .lbl{display:none}
  .c-del{grid-column:2;grid-row:1;padding-top:0;align-items:flex-end}
  .c-del .del{width:auto;padding:5px 12px}
  .c-title{grid-column:1/-1}
  .c-title .lbl{display:none}
  .f.title{font-size:16px}
  .c-author{grid-column:1}
  .c-date{grid-column:2}
  .c-plan{grid-column:1}
  .c-status{grid-column:2}
  .c-series{grid-column:1/-1}
  .c-prog,.c-caution{grid-column:1/-1}
  .addrow{border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface)}
}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-title{font-family:var(--font-display);font-size:22px;font-weight:700;min-width:140px;text-align:center;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.icon-btn:hover{border-color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk.names div{padding:8px 8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);text-align:left}
.wk.names div:first-child{color:var(--sun)}
.wk.names div:last-child{color:var(--sat)}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--surface-2)}
.day.out .dn{color:var(--faint)}
.dn{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.day.sun .dn{color:var(--sun)}
.day.sat .dn{color:var(--sat)}
.day.today .dn{background:var(--today);color:#fff}
.ev{border:1px solid var(--none-line);background:var(--none-bg);color:var(--none-ink);border-radius:6px;padding:3px 6px;font-size:12px;text-align:left;width:100%;min-width:0;display:flex;align-items:center;gap:5px;line-height:1.35}
.ev .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ev .w{width:7px;height:7px;border-radius:50%;background:var(--warn-ink);flex:none}
.ev .pc{font-size:10px;font-weight:700;color:var(--pc-ink);flex:none}
.ag-pc-title,.ag-pc-title b{color:var(--pc-ink)!important}
.ag-date.none{color:var(--faint);font-weight:400}
.ev.hj{background:var(--hj-bg);border-color:var(--hj-line);color:var(--hj-ink)}
.ev.dd{background:var(--dd-bg);border-color:var(--dd-line);color:var(--dd-ink)}
.ev.bj{background:var(--bj-bg);border-color:var(--bj-line);color:var(--bj-ink)}
.ev:hover{filter:brightness(.97);border-color:currentColor}
.ev.sel{box-shadow:0 0 0 2px var(--focus)}
.ag-list{display:flex;flex-direction:column}
.ag-row{position:relative;border-top:1px solid var(--line)}
.ag-row:first-child{border-top:0}
.ag-t{width:100%;text-align:left;background:none;border:0;padding:9px 6px;font-weight:600;border-radius:6px;display:block;color:var(--ink)}
.ag-t:hover{background:var(--surface-2)}
.ag-t[aria-expanded="true"]{color:var(--focus)}
.pop{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px rgba(20,18,28,.18);padding:14px 16px;display:flex;flex-direction:column;gap:12px;margin-top:2px}
.pop-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pop .dt-grid{grid-template-columns:repeat(2,minmax(0,1fr));border-top:0;padding-top:0}
.pop .dt-grid>div{grid-column:span 1}
.pop .dt-grid>.wide{grid-column:1/-1}
.detail{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.dt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.dt-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.dt-title h3{margin:0;font-family:var(--font-display);font-size:20px;line-height:1.3}
.dt-actions{display:flex;gap:6px}
.dt-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 20px;border-top:1px solid var(--line);padding-top:14px}
.dt-grid>div{min-width:0;grid-column:span 2}
.dt-grid>.wide{grid-column:span 3}
.dt-k{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.dt-k.warn{color:var(--warn-ink)}
.dt-v{white-space:pre-line;overflow-wrap:anywhere}

@media (max-width:760px){.dt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dt-grid>div{grid-column:span 1}.dt-grid>.wide{grid-column:1/-1}}

}
.agenda{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.agenda{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:700}
.panel h2 b{color:var(--focus)}
.ag-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.ag-item:first-of-type{border-top:0}
.ag-item:hover .ag-title{text-decoration:underline}
.ag-date{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:13px}
.ag-date.past{color:var(--faint)}
.ag-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.ag-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ag-title{font-weight:600}
.ag-author{color:var(--muted);font-size:13px}
.ag-note{color:var(--muted);font-size:13px;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ag-warn{color:var(--warn-ink);font-size:13px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:3px 8px;white-space:pre-line}
.pill{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;border:1px solid var(--none-line);background:var(--none-bg);color:var(--none-ink)}
.pill.hj{background:var(--hj-bg);border-color:var(--hj-line);color:var(--hj-ink)}
.pill.dd{background:var(--dd-bg);border-color:var(--dd-line);color:var(--dd-ink)}
.pill.bj{background:var(--bj-bg);border-color:var(--bj-line);color:var(--bj-ink)}
.undated{display:flex;flex-wrap:wrap;gap:6px}
.undated .ev{width:auto;max-width:100%}
.muted{color:var(--muted)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(460px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,18,28,.4)}
.dlg-body{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.dlg-body h3{margin:0;font-size:19px;font-family:var(--font-display)}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}

.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2)}

/* toast + banner */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;max-width:calc(100vw - 32px);font-size:13.5px}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px 6px}
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){.row.flash{animation:none}}
/* app tabs */
.apptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.apptab{padding:10px 18px 11px;font-size:16px;font-weight:700;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.apptab:hover{color:var(--ink)}
.apptab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
</style>

<div class="wrap">

    <div>

        </div>

      </div>
    </div>

    <div class="cal-head">
      <div class="cal-nav">
        <button class="icon-btn" id="cal-prev" type="button" aria-label="이전 달">‹</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="icon-btn" id="cal-next" type="button" aria-label="다음 달">›</button>

      </div>

        <span><i style="background:var(--hj-solid)"></i>혜지원</span>
        <span><i style="background:var(--dd-solid)"></i>다정다감</span>

      <div class="panel" id="ag-w"></div>

</div>

<dialog id="dlg"><div id="dlg-in"></div></dialog>
<div class="toast" id="toast" hidden><span id="toast-t"></span><button type="button" id="toast-a" hidden></button></div>

<script>
(()=>{
'use strict';
const FB='https://checkingword-8cf0d-default-rtdb.firebaseio.com/publishplan/manuscripts';
const BRANDS=[{id:'hj',name:'혜지원'},{id:'dd',name:'다정다감'},{id:'bj',name:'북장단'}];
const BN=Object.fromEntries(BRANDS.map(b=>[b.id,b.name]));
const WD=['일','월','화','수','목','금','토'];
const DEL_ICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg>';

const today=new Date(); today.setHours(0,0,0,0);
const S={tree:{},mode:'loading',tab:'table',brand:'',q:'',sort:'desc',fresh:[],sel:'',pop:'',proot:{},fst:[],cal:{y:today.getFullYear(),m:today.getMonth()}};
try{const t=localStorage.getItem('ms-tab'); if(t==='cal') S.tab='cal'; const s=localStorage.getItem('ms-sort'); if(['desc','asc','order','title','author','plan'].includes(s)) S.sort=s; const f=JSON.parse(localStorage.getItem('ms-fst')||'[]'); if(Array.isArray(f)) S.fst=f.map(String);}catch(e){}
if(location.hash==='#calendar') S.tab='cal';

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');

/* ---------- dates: 26.10.19 ---------- */
function parseDate(txt){
  const s=String(txt||'').trim(); if(!s) return {ok:true,iso:''};
  let y,m,d; let mt;
  const digits=s.replace(/\D/g,'');
  if((mt=s.match(/^(\d{2}|\d{4})\s*[.\-\/년\s]\s*(\d{1,2})\s*[.\-\/월\s]\s*(\d{1,2})\s*일?\.?$/))){y=+mt[1];m=+mt[2];d=+mt[3]}
  else if((mt=s.match(/^(\d{1,2})\s*[.\-\/월\s]\s*(\d{1,2})\s*일?\.?$/))){y=today.getFullYear();m=+mt[1];d=+mt[2]}
  else if(/^\d{6}$/.test(s)){y=+digits.slice(0,2);m=+digits.slice(2,4);d=+digits.slice(4,6)}
  else if(/^\d{8}$/.test(s)){y=+digits.slice(0,4);m=+digits.slice(4,6);d=+digits.slice(6,8)}
  else return {ok:false};
  if(y<100) y+=2000;
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return {ok:false};
  return {ok:true,iso:`${y}-${pad(m)}-${pad(d)}`};
}
const toDate=iso=>{const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d)};
const short=iso=>iso?`${iso.slice(2,4)}.${iso.slice(5,7)}.${iso.slice(8,10)}`:'';
function dmeta(iso){
  if(!iso) return '';
  const dt=toDate(iso); const diff=Math.round((dt-today)/86400000);
  let dd=''; if(diff===0) dd='<span class="dd">오늘</span>'; else if(diff>0) dd=`<span class="dd">D-${diff}</span>`;
  return dd;
}

/* ---------- data ---------- */
const DEF={brand:'',title:'',author:'',date:'',progress:'',caution:'',order:0,pc:false};
function realItems(){const o=S.tree.items||{}; return Object.keys(o).filter(k=>o[k]).map(id=>Object.assign({},DEF,o[id],{id}))}
/* 계획표에만 있는 책도 원고 진행 상황에 줄로 보여 주기 (고치면 그때 저장) */
function virtualItems(){
  if(!S.planReady) return [];
  const bs=planBooks(); const own=S.tree.items||{}; const linked=new Set();
  realItems().forEach(it=>{if(it.planId) linked.add(it.planId); const pb=planOf(it); if(pb) linked.add(pb.id)});
  const out=[];
  for(const bid in bs){const b=bs[bid]; if(!b||linked.has(bid)||own['p_'+bid]) continue;
    out.push(Object.assign({},DEF,{id:'p_'+bid,planId:bid,title:b.title||'',author:b.author||'',brand:b.brand||'',order:Date.parse(b.createdAt||'')||0,virtual:true}))}
  return out;
}
function items(){return realItems().filter(x=>!x.hidden).concat(virtualItems())}
function item(id){const v=(S.tree.items||{})[id]; if(v) return Object.assign({},DEF,v,{id}); return virtualItems().find(x=>x.id===id)||null}
function materialize(id){
  if(!String(id).startsWith('p_')||(S.tree.items||{})[id]) return;
  const v=item(id); if(!v) return;
  const base={planId:v.planId,title:v.title,author:v.author,brand:v.brand,order:v.order||Date.now(),createdAt:new Date().toISOString()};
  localSet(id,base); queue('i:'+id,()=>fb('/items/'+id,'PATCH',base)).catch(fail);
}

const chains={};
function queue(k,fn){const p=(chains[k]||Promise.resolve()).then(fn,fn); chains[k]=p.catch(()=>{}); return p}
async function fb(path,method,body){
  const r=await fetch(FB+path+'.json',{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok){const e=new Error('HTTP '+r.status); e.status=r.status; throw e}
  return r;
}
function fail(e){console.error(e); toast(e&&(e.status===401||e.status===403)?'저장 권한이 없어요. 파이어베이스 규칙을 확인해 주세요.':'저장하지 못했어요. 인터넷 연결을 확인해 주세요.')}
function localSet(id,patch){S.tree.items=S.tree.items||{}; S.tree.items[id]=Object.assign({},S.tree.items[id]||{},patch)}
const timers={};
function saveField(id,field,val,delay){
  materialize(id);
  if(field==='title'){const old=item(id); if(old&&(!old.planId||!planBooks()[old.planId])){const pb=planOf(old); if(pb){localSet(id,{planId:pb.id}); queue('i:'+id,()=>fb('/items/'+id,'PATCH',{planId:pb.id})).catch(fail)}}}
  localSet(id,{[field]:val});
  if(['title','author','brand'].includes(field)){const it=item(id); const bs=planBooks(); if(it&&it.planId&&bs[it.planId]){bs[it.planId][field]=val; const pid=it.planId; clearTimeout(timers['p:'+pid+field]); timers['p:'+pid+field]=setTimeout(()=>queue('p:'+pid,()=>pfb('/books/'+pid,'PATCH',{[field]:val})).catch(fail),delay||0)}}
  const k=id+':'+field; clearTimeout(timers[k]);
  const go=()=>queue('i:'+id,()=>fb('/items/'+id,'PATCH',{[field]:val})).catch(fail);
  if(delay) timers[k]=setTimeout(go,delay); else go();
}

const PC_RE=/p\s*c\s*교\s*정\s*진\s*행\s*중/i;
function stripPC(v){return v.replace(PC_RE,'').replace(/^[ \t]*[\/·,\-][ \t]*/,'').replace(/[ \t]*[\/·,][ \t]*$/,'').replace(/[ \t]*\/[ \t]*\/[ \t]*/g,' / ').replace(/^\s*\n/,'').trim()}
function checkPC(el){
  if(!PC_RE.test(el.value)) return false;
  const r=el.closest('.row'); const id=r.dataset.id; materialize(id); const nv=stripPC(el.value);
  el.value=nv; autosize(el); $('.pcbadge',r).hidden=false;
  const k=id+':progress'; clearTimeout(timers[k]); delete timers[k];
  const pid=pcStatusId();
  if(pid){localSet(id,{progress:nv}); queue('i:'+id,()=>fb('/items/'+id,'PATCH',{progress:nv})).catch(fail); planSet(id,{status:pid},0)}
  else {localSet(id,{progress:nv,pc:true}); queue('i:'+id,()=>fb('/items/'+id,'PATCH',{progress:nv,pc:true})).catch(fail)}
  return true;
}
/* ---------- 출간 계획표 연동 ---------- */
const PB='https://checkingword-8cf0d-default-rtdb.firebaseio.com/publishplan';
async function pfb(path,method,body){
  const r=await fetch(PB+path+'.json',{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok){const e=new Error('HTTP '+r.status); e.status=r.status; throw e}
  return r;
}
const asArr=v=>Array.isArray(v)?v.filter(x=>x!=null):(v&&typeof v==='object'?Object.values(v):[]);
const norm=t=>String(t||'').replace(/\s+/g,'').toLowerCase();
function planBooks(){S.proot.books=S.proot.books||{}; return S.proot.books}
function planOf(it){
  const bs=planBooks();
  if(it.planId){if(bs[it.planId]) return Object.assign({},bs[it.planId],{id:it.planId}); if(!S.planReady||it.virtual) return null}
  const t=norm(it.title); if(!t) return null;
  const used=new Set(realItems().filter(x=>x.id!==it.id).map(x=>x.planId).filter(Boolean));
  let exact=null; const near=[];
  for(const id in bs){const b=bs[id]; if(!b||used.has(id)) continue; const bt=norm(b.title); if(!bt) continue;
    if(bt===t){exact=id; break}
    if(t.length>=3&&bt.length>=3&&(bt.includes(t)||t.includes(bt))) near.push(id)}
  const id=exact||(near.length===1?near[0]:null);
  return id?Object.assign({},bs[id],{id}):null;
}
const PLAN_DEFAULT_ST=[{id:'s1',name:'계약'},{id:'s2',name:'원고'},{id:'s3',name:'그림'},{id:'s4',name:'편집'},{id:'s5',name:'인쇄'},{id:'s6',name:'출간'},{id:'s7',name:'보류'}];
function statuses(){const a=asArr((S.proot.settings||{}).statuses); return a.length?a:PLAN_DEFAULT_ST}
function statusName(id){const x=statuses().find(s=>s.id===id); return x?x.name:''}
function pcStatusId(){const x=statuses().find(s=>/pc\s*교정/i.test(s.name)); return x?x.id:''}
function isPC(it){const pid=pcStatusId(); const pb=planOf(it); if(pid&&pb) return pb.status===pid; return !!it.pc}
const creating={};
function ensurePlan(id){
  if(creating[id]) return creating[id];
  creating[id]=(async()=>{
    const it=item(id); const pb=planOf(it);
    if(pb){if(it.planId!==pb.id) saveField(id,'planId',pb.id,0); return pb.id}
    const y=today.getFullYear(); await ensureYear(y);
    const nid='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const nb={year:y,month:0,title:it.title,author:it.author,contractDate:'',brand:it.brand,genre:'',status:(statuses()[0]||{}).id||'',star:false,series:false,seriesName:'',seriesNo:'',tentative:false,memo:'',history:[],createdAt:new Date().toISOString()};
    saveField(id,'planId',nid,0); putPlan(nid,nb); toast('출간 계획표에도 이 책을 넣었어요. 출간월은 미정이에요.');
    return nid;
  })();
  return creating[id].finally(()=>{delete creating[id]});
}
async function planSet(id,patch,delay){
  if(!S.planReady){toast('출간 계획표를 불러오는 중이에요. 잠시 후 다시 해 주세요.'); return}
  const pid=await ensurePlan(id); const bs=planBooks(); bs[pid]=Object.assign({},bs[pid],patch); render();
  const k='pf:'+pid+':'+Object.keys(patch).join(','); clearTimeout(timers[k]);
  const go=()=>queue('p:'+pid,()=>pfb('/books/'+pid,'PATCH',patch)).catch(fail);
  if(delay) timers[k]=setTimeout(go,delay); else go();
}
function planKey(it){const pb=planOf(it); const m=pb?Number(pb.month)||0:0; return m?Number(pb.year)*100+m:0}
function writingStatusId(){const x=statuses().find(s=>/원고\s*작성/.test(s.name)); return x?x.id:''}
function planInput(pb){if(!pb) return ''; const m=Number(pb.month)||0; return m?`${String(pb.year).slice(2)}.${pad(m)}`:''}
function planText(pb){if(!pb) return ''; const m=Number(pb.month)||0; return m?`${pb.year}년 ${m}월`:`${pb.year}년 · 출간월 미정`}
function parsePlan(txt){
  const s=String(txt||'').trim(); if(!s) return {ok:true,clear:true};
  let mt,y,m;
  if((mt=s.match(/^(\d{2}|\d{4})\s*[.\-\/년\s]\s*(\d{1,2})\s*월?(?:\s*[.\-\/]\s*\d{1,2}\s*일?)?\.?$/))){y=+mt[1];m=+mt[2]}
  else if((mt=s.match(/^(\d{1,2})\s*월?$/))){y=today.getFullYear();m=+mt[1]}
  else if(/^\d{4}$/.test(s)){y=+s.slice(0,2);m=+s.slice(2)}
  else if(/^\d{6}$/.test(s)){y=+s.slice(0,2);m=+s.slice(2,4)}
  else return {ok:false};
  if(y<100) y+=2000;
  if(!(m>=1&&m<=12)) return {ok:false};
  return {ok:true,y,m};
}
async function ensureYear(y){

async function setPlan(id,p){

  }

}

/* ---------- filter + sort ---------- */
function visible(){
  const q=S.q.trim().toLowerCase();
  return items().filter(it=>{
    if(S.brand==='none'&&it.brand) return false;
    if(S.brand&&S.brand!=='none'&&it.brand!==S.brand) return false;
    if(S.fst.length){const st=(planOf(it)||{}).status||''; if(!S.fst.includes(st||'__none')) return false}
    if(q&&![it.title,it.author,it.progress,it.caution,BN[it.brand]||'',isPC(it)?'pc교정 진행중':'',statusName((planOf(it)||{}).status)].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort(cmp);
}
function cmp(a,b){
  const fa=S.fresh.indexOf(a.id), fb2=S.fresh.indexOf(b.id);
  if(fa>-1||fb2>-1){if(fa===-1) return 1; if(fb2===-1) return -1; return fa-fb2}
  if(S.sort==='order') return (a.order||0)-(b.order||0);
  const ko=(x,y)=>String(x||'').localeCompare(String(y||''),'ko');
  if(S.sort==='title'){if(!a.title!==!b.title) return a.title?-1:1; return ko(a.title,b.title)||(a.order||0)-(b.order||0)}
  if(S.sort==='author'){if(!a.author!==!b.author) return a.author?-1:1; return ko(a.author,b.author)||ko(a.title,b.title)}
  if(S.sort==='plan'){const pa=planKey(a), pb2=planKey(b); if(!pa!==!pb2) return pa?-1:1; if(pa!==pb2) return pa-pb2; return ko(a.title,b.title)}
  if(a.date&&!b.date) return -1; if(!a.date&&b.date) return 1;
  if(a.date&&b.date&&a.date!==b.date) return S.sort==='asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date);
  return (a.order||0)-(b.order||0);
}

function renderCal(){
  const {y,m}=S.cal;
  $('#cal-title').textContent=`${y}년 ${m+1}월`;
  const all=items();
  const byDate={}; all.forEach(it=>{if(it.date)(byDate[it.date]=byDate[it.date]||[]).push(it)});
  const first=new Date(y,m,1); const start=new Date(y,m,1-first.getDay());

  for(let i=0;i<weeks*7;i++){

    const iso=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const cls=['day']; if(d.getMonth()!==m) cls.push('out'); if(d.getDay()===0) cls.push('sun'); if(d.getDay()===6) cls.push('sat'); if(+d===+today) cls.push('today');

  const names=S.fst.map(id=>(opts.find(o=>o.id===id)||{}).name).filter(Boolean);
  $('#fst-t').textContent=!names.length?'진행 상태 전체':names.length===1?names[0]:`${names[0]} 외 ${names.length-1}개`;
  $('#fst-btn').classList.toggle('on',!!names.length);
}
function saveFst(){try{localStorage.setItem('ms-fst',JSON.stringify(S.fst))}catch(e){}}
function setTab(t){
  S.tab=t; try{localStorage.setItem('ms-tab',t)}catch(e){}
  $('#tab-table').setAttribute('aria-selected',t==='table'); $('#tab-cal').setAttribute('aria-selected',t==='cal');
  $('#view-table').hidden=t!=='table'; $('#view-cal').hidden=t!=='cal'; $('#tools').hidden=t!=='table';
  document.body.classList.toggle('tbl',t==='table');
}
function render(){renderChips(); if(S.tab==='table') renderTable(); else renderCal()}
function setLive(s,t){const l=$('#live'); l.dataset.s=s; $('#live-t').textContent=t}
let toastTimer;
function toast(msg,action,fn){
  const t=$('#toast'); $('#toast-t').textContent=msg; const a=$('#toast-a');
  if(action){a.hidden=false; a.textContent=action; a.onclick=()=>{t.hidden=true; fn()}} else {a.hidden=true; a.onclick=null}
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,action?7000:2600);
}

  });
  box.addEventListener('input',e=>{const el=e.target; const pf=el.dataset.pf; if(!pf||pf==='status') return; if(pf==='seriesNo'){const v=el.value.replace(/\D/g,''); if(v!==el.value) el.value=v} const r=el.closest('.row'); const nm=$('[data-pf=seriesName]',r).value.trim(), no=$('[data-pf=seriesNo]',r).value.trim(); planSet(r.dataset.id,{[pf]:el.value,series:!!(nm||no)},600)});

  box.addEventListener('compositionend',e=>{const el=e.target; if(el.dataset&&el.dataset.f==='progress') checkPC(el)});
  box.addEventListener('input',e=>{
    const el=e.target; const f=el.dataset.f; if(!f) return; const id=el.closest('.row').dataset.id;
    if(el.tagName==='TEXTAREA') autosize(el);

    if(f==='plan'){el.classList.remove('bad'); const m=$('.pmeta',el.closest('.row')); m.classList.remove('err'); return}
    if(f==='brand') return;
    if(f==='progress'&&!e.isComposing&&checkPC(el)) return;
    saveField(id,f,el.value,500);
  });
  box.addEventListener('change',e=>{
    const el=e.target; if(el.dataset.f!=='brand') return; const r=el.closest('.row');
    r.dataset.brand=el.value||'none'; saveField(r.dataset.id,'brand',el.value,0); renderChips();
  });
  box.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!e.isComposing){e.preventDefault(); e.target.blur()}
  });
  box.addEventListener('focusout',e=>{
    const el=e.target; const f=el.dataset.f; if(!f) return; const r=el.closest('.row'); const id=r.dataset.id;
    if(f==='date'){
      const p=parseDate(el.value); const m=$('.dmeta',r);

      if(p.iso!==prev){saveField(id,'date',p.iso,0)}

      const p=parsePlan(el.value); const m=$('.pmeta',r);
      if(!p.ok){el.classList.add('bad'); m.classList.remove('linked'); m.classList.add('err'); m.textContent='예) 26.12'; return}

      setPlan(id,p);
    } else if(f!=='brand'){
      const k=id+':'+f; if(timers[k]){clearTimeout(timers[k]); delete timers[k]; saveField(id,f,el.value,0)}
    }
    setTimeout(()=>{if(!box.contains(document.activeElement)){const before=[...box.children].map(x=>x.dataset.id).join(','); renderTable(); const after=[...box.children].map(x=>x.dataset.id).join(','); if(before!==after){const row=rowEls.get(id); if(row){row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash')}}}},0);
  });
}

/* ---------- realtime ---------- */
function applyEvent(path,data,merge){S.tree=applyTo(S.tree,path,data,merge)}
function applyTo(root,path,data,merge){
  const segs=path.split('/').filter(Boolean);
  if(!segs.length){
    if(merge){for(const k in data){if(data[k]===null) delete root[k]; else root[k]=data[k]} return root}
    return data&&typeof data==='object'?data:{};
  }
  let o=root;
  for(let i=0;i<segs.length-1;i++){if(!o[segs[i]]||typeof o[segs[i]]!=='object') o[segs[i]]={}; o=o[segs[i]]}
  const k=segs[segs.length-1];
  if(merge){if(!o[k]||typeof o[k]!=='object') o[k]={}; for(const kk in data){if(data[kk]===null) delete o[k][kk]; else o[k][kk]=data[kk]}}
  else {if(data===null) delete o[k]; else o[k]=data}
  return root;
}

function seedIfNeeded(){
  if((S.tree.meta&&S.tree.meta.seeded)||Object.keys(S.tree.items||{}).length) return;
  const up={'meta/seeded':true};
  SEED.forEach((r,i)=>{up['items/s'+pad(i+1)]={brand:r[0],title:r[1],author:r[2],date:r[3],progress:r[4],caution:'',order:i+1,createdAt:new Date().toISOString()}});
  for(const k in up){const [a,b]=k.split('/'); S.tree[a]=S.tree[a]||{}; S.tree[a][b]=up[k]}
  render();
  fb('','PATCH',up).catch(fail);
}

function boot(){
  bind(); setTab(S.tab); render();
  let es; try{es=new EventSource(FB+'.json')}catch(e){es=null}
  if(!es){setLive('off','실시간 연결 안 됨'); $('#banner').innerHTML='<div class="banner">이 브라우저에서는 실시간 연결을 쓸 수 없어요. 크롬이나 사파리 최신 버전으로 열어 주세요.</div>'; return}
  const slow=setTimeout(()=>{if(S.mode==='loading') $('#banner').innerHTML='<div class="banner">서버에 연결하는 중이에요. 이 문구가 계속 보이면 새로고침해 주세요.</div>'},8000);
  const on=merge=>ev=>{
    let p; try{p=JSON.parse(ev.data)}catch(e){return} if(!p) return;
    applyEvent(p.path||'/',p.data,merge);
    if(S.mode==='loading'){S.mode='live'; clearTimeout(slow); $('#banner').innerHTML=''; setLive('live','실시간 저장 중'); seedIfNeeded()}
    render();
  };
  es.addEventListener('put',on(false));
  es.addEventListener('patch',on(true));
  es.addEventListener('cancel',()=>{setLive('off','읽기 권한 없음'); $('#banner').innerHTML='<div class="banner">표를 읽을 권한이 없어요. 파이어베이스 규칙을 확인해 주세요.</div>'});
  es.onerror=()=>{if(S.mode==='live'){setLive('off','다시 연결하는 중')}};
  es.onopen=()=>{if(S.mode==='live') setLive('live','실시간 저장 중')};

}
